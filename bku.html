<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BKU Bulanan - Pondok Pesantren Nurmilad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .bku-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.8rem;
        }
        .bku-table th, .bku-table td {
            border: 1px solid #cbd5e1;
            padding: 8px;
            vertical-align: top;
        }
        .bku-table th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
        }
        /* Atur lebar kolom */
        .bku-table th:nth-child(1), .bku-table td:nth-child(1) { width: 100px; } /* Tanggal */
        .bku-table th:nth-child(2), .bku-table td:nth-child(2) { min-width: 350px; } /* Uraian - lebar */
        .bku-table th:nth-child(3), .bku-table td:nth-child(3) { width: 130px; text-align: right; } /* Pemasukan */
        .bku-table th:nth-child(4), .bku-table td:nth-child(4) { width: 130px; text-align: right; } /* Pengeluaran */
        .bku-table th:nth-child(5), .bku-table td:nth-child(5) { width: 150px; text-align: right; } /* Saldo */
        .print-container {
            padding: 20px;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            .print-container, .print-container * {
                visibility: visible;
            }
            .print-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none;
            }
            button, .filter-panel {
                display: none;
            }
            table {
                font-size: 10pt;
            }
            th, td {
                padding: 4px;
            }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b no-print">
        <div class="px-4 md:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="#" id="backLink" class="text-emerald-600 hover:text-emerald-700"><i class="fas fa-arrow-left text-lg"></i></a>
                <h1 class="font-bold text-gray-800 text-lg">Buku Kas Umum (BKU)</h1>
            </div>
            <div>
                <button id="printBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm flex items-center gap-2">
                    <i class="fas fa-print"></i> Cetak
                </button>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-7xl mx-auto">
        <div id="jenisInfo" class="bg-emerald-50 p-2 rounded text-sm mb-4 text-center no-print">Memproses...</div>

        <!-- Filter Bulan/Tahun -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 flex flex-wrap gap-4 items-end no-print">
            <div>
                <label class="text-sm font-medium">Bulan</label>
                <select id="bulanSelect" class="border rounded p-2">
                    <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
                    <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
                    <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
                    <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
                </select>
            </div>
            <div>
                <label class="text-sm font-medium">Tahun</label>
                <select id="tahunSelect" class="border rounded p-2"></select>
            </div>
            <button id="tampilkanBtn" class="bg-emerald-600 text-white px-4 py-2 rounded">Tampilkan</button>
        </div>

        <!-- Tabel BKU -->
        <div class="bg-white rounded-xl shadow overflow-hidden print-container">
            <div class="overflow-x-auto">
                <table class="bku-table" id="bkuTable">
                    <thead>
                        <tr><th>Tanggal</th><th>Uraian</th><th>Pemasukan (Rp)</th><th>Pengeluaran (Rp)</th><th>Saldo (Rp)</th></tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" class="text-center py-10">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="toast" class="toast hidden no-print"><i class="fas fa-check-circle text-emerald-400"></i> <span id="toastMsg"></span></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-8JKpTqvufYw5b1JHEbOPRiIrAfX4z9w",
            authDomain: "bendaharanbs.firebaseapp.com",
            projectId: "bendaharanbs",
            storageBucket: "bendaharanbs.firebasestorage.app",
            messagingSenderId: "853301471376",
            appId: "1:853301471376:web:7ac52bdf8ea65bfc169015"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const jenis = urlParams.get('jenis') === 'pondok' ? 'pondok' : 'konsumsi';
        document.getElementById('jenisInfo').innerHTML = `📌 Buku Kas Umum untuk <strong>Iuran ${jenis === 'konsumsi' ? 'Konsumsi' : 'Pondok'}</strong>`;
        // Back link dinamis
        document.getElementById('backLink').href = `submenu.html?jenis=${jenis}`;

        // Inisialisasi dropdown tahun
        const tahunSelect = document.getElementById('tahunSelect');
        const currentYear = new Date().getFullYear();
        for (let y = 2009; y <= 2045; y++) {
            const option = document.createElement('option');
            option.value = y;
            option.textContent = y;
            if (y === currentYear) option.selected = true;
            tahunSelect.appendChild(option);
        }

        let allTransactions = []; // semua transaksi untuk jenis iuran ini, diurutkan ascending

        async function loadAllTransactions() {
            try {
                let snap;
                try {
                    snap = await db.collection('transaksi')
                        .where('jenis_iuran', '==', jenis)
                        .orderBy('tanggal', 'asc')
                        .get();
                } catch(e) {
                    console.warn('Query filtered gagal, ambil semua lalu filter manual');
                    snap = await db.collection('transaksi').orderBy('tanggal', 'asc').get();
                }
                const transactions = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    let tgl = data.tanggal;
                    if (tgl && typeof tgl.toDate === 'function') tgl = tgl.toDate().toISOString().slice(0,10);
                    if (!tgl || tgl === 'Invalid Date') tgl = '';
                    const dataJenis = data.jenis_iuran || jenis;
                    if (dataJenis !== jenis) return;
                    transactions.push({
                        id: doc.id,
                        tanggal: tgl,
                        uraian: data.uraian || '',
                        pemasukan: data.pemasukan || 0,
                        pengeluaran: data.pengeluaran || 0,
                    });
                });
                // Urutkan berdasarkan tanggal (sudah dari query, tapi amankan)
                transactions.sort((a,b) => a.tanggal.localeCompare(b.tanggal));
                allTransactions = transactions;
            } catch(err) {
                console.error(err);
                showToast('Gagal memuat transaksi: ' + err.message, true);
            }
        }

        // Mendapatkan transaksi dalam rentang bulan tertentu
        function getTransactionsInMonth(year, month) {
            const startDate = `${year}-${String(month).padStart(2,'0')}-01`;
            const lastDay = new Date(year, month, 0).getDate();
            const endDate = `${year}-${String(month).padStart(2,'0')}-${lastDay}`;
            return allTransactions.filter(t => t.tanggal >= startDate && t.tanggal <= endDate);
        }

        // Hitung saldo akhir dari semua transaksi sebelum tanggal tertentu (tidak termasuk bulan yang dipilih)
        function getSaldoAwal(year, month) {
            const startDate = `${year}-${String(month).padStart(2,'0')}-01`;
            let saldo = 0;
            for (const t of allTransactions) {
                if (t.tanggal < startDate) {
                    saldo += (t.pemasukan - t.pengeluaran);
                } else {
                    break; // karena sudah terurut ascending
                }
            }
            return saldo;
        }

        // Render tabel BKU
        function renderBKU(year, month) {
            const transInMonth = getTransactionsInMonth(year, month);
            const saldoAwal = getSaldoAwal(year, month);
            let saldoBerjalan = saldoAwal;
            const tbody = document.getElementById('tableBody');
            if (transInMonth.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10">Tidak ada transaksi pada bulan ini</td></tr>`;
                // Tampilkan baris saldo awal saja
                // Tidak perlu, karena tidak ada transaksi
                return;
            }
            let html = '';
            // Baris saldo awal
            html += `<tr style="background-color:#fefce8;"><td colspan="2"><strong>Saldo Awal Bulan</strong></td><td class="text-right"></td><td class="text-right"></td><td class="text-right"><strong>${formatRupiah(saldoAwal)}</strong></td></tr>`;
            for (const tr of transInMonth) {
                saldoBerjalan += (tr.pemasukan - tr.pengeluaran);
                html += `<tr>`;
                html += `<td>${tr.tanggal}</td>`;
                html += `<td>${escapeHtml(tr.uraian)}</td>`;
                html += `<td class="text-right">${tr.pemasukan ? formatRupiah(tr.pemasukan) : ''}</td>`;
                html += `<td class="text-right">${tr.pengeluaran ? formatRupiah(tr.pengeluaran) : ''}</td>`;
                html += `<td class="text-right">${formatRupiah(saldoBerjalan)}</td>`;
                html += `</tr>`;
            }
            // Baris saldo akhir
            html += `<tr style="background-color:#f1f5f9;"><td colspan="4" class="text-right font-bold">Saldo Akhir Bulan</td><td class="text-right font-bold">${formatRupiah(saldoBerjalan)}</td></tr>`;
            tbody.innerHTML = html;
        }

        function formatRupiah(angka) {
            if (angka === undefined || angka === null) return '0';
            let str = Math.floor(angka).toString();
            let result = '';
            for (let i = str.length - 1, j = 0; i >= 0; i--, j++) {
                if (j > 0 && j % 3 === 0) result = '.' + result;
                result = str[i] + result;
            }
            return result;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError=false) {
            const toast = document.getElementById('toast');
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-emerald-400';
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Event handler tampilkan
        async function tampilkanBKU() {
            const bulan = parseInt(document.getElementById('bulanSelect').value);
            const tahun = parseInt(document.getElementById('tahunSelect').value);
            // Pastikan data transaksi sudah dimuat
            if (allTransactions.length === 0) {
                showToast('Memuat data transaksi...', true);
                await loadAllTransactions();
            }
            renderBKU(tahun, bulan);
        }

        // Cetak
        document.getElementById('printBtn').addEventListener('click', () => {
            window.print();
        });

        document.getElementById('tampilkanBtn').addEventListener('click', tampilkanBKU);

        // Inisialisasi
        window.addEventListener('DOMContentLoaded', async () => {
            await loadAllTransactions();
            // Set default bulan/tahun ke bulan saat ini
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            document.getElementById('bulanSelect').value = currentMonth;
            tampilkanBKU();
        });
    </script>
</body>
</html>
