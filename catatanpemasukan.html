<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Catatan Pemasukan - Pondok Pesantren Nurmilad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .catatan-table { border-collapse: collapse; width: 100%; font-size: 0.75rem; }
        .catatan-table th, .catatan-table td { border: 1px solid #cbd5e1; padding: 6px; vertical-align: top; }
        .catatan-table th { background-color: #f1f5f9; font-weight: 600; text-align: center; }
        .exported-row { background-color: #d1fae5 !important; }
        input, select { width: 100%; border: none; background: transparent; padding: 4px; }
        input:focus, select:focus { outline: none; background-color: #fefce8; }
        .relative { position: relative; }
        .autocomplete-items { position: absolute; background: white; border: 1px solid #ddd; max-height: 150px; overflow-y: auto; z-index: 20; min-width: 200px; }
        .autocomplete-item { padding: 6px; cursor: pointer; border-bottom: 1px solid #eee; }
        .autocomplete-item:hover { background-color: #e9e9e9; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: white; padding: 8px 14px; border-radius: 8px; z-index: 1000; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b">
        <div class="px-4 md:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-emerald-600 hover:text-emerald-700"><i class="fas fa-arrow-left text-lg"></i></a>
                <h1 class="font-bold text-gray-800 text-lg">Catatan Pemasukan</h1>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-full mx-auto">
        <!-- Filter -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 flex flex-wrap gap-4 items-end">
            <div><label class="text-sm font-medium">Dari Tanggal</label><input type="date" id="filterDari" class="border rounded p-2"></div>
            <div><label class="text-sm font-medium">Sampai Tanggal</label><input type="date" id="filterSampai" class="border rounded p-2"></div>
            <button id="filterBtn" class="bg-emerald-600 text-white px-3 py-2 rounded">Filter</button>
            <button id="resetFilterBtn" class="bg-gray-500 text-white px-3 py-2 rounded">Reset</button>
        </div>

        <!-- Tabel Catatan Pemasukan -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="catatan-table">
                    <thead>
                        <tr><th>Tanggal</th><th>Uraian</th><th>Konsumsi (Rp)</th><th>Bulan*</th><th>Pondok (Rp)</th><th>Bulan**</th><th>Jumlah (Rp)</th><th>Aksi</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="p-3 text-right"><button id="tambahBarisBtn" class="bg-emerald-600 text-white px-3 py-1 rounded text-sm">+ Tambah Baris</button></div>
        </div>
    </main>

    <div id="toast" class="toast hidden"><i class="fas fa-check-circle text-emerald-400"></i> <span id="toastMsg"></span></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-8JKpTqvufYw5b1JHEbOPRiIrAfX4z9w",
            authDomain: "bendaharanbs.firebaseapp.com",
            projectId: "bendaharanbs",
            storageBucket: "bendaharanbs.firebasestorage.app",
            messagingSenderId: "853301471376",
            appId: "1:853301471376:web:7ac52bdf8ea65bfc169015"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Data global
        let catatanList = [];        // array of row objects
        let santriList = [];         // { id, nis, nama }
        let iuranKonsumsiMap = new Map(); // santriId -> array 72 bulan
        let iuranPondokMap = new Map();
        let saveTimeout = null;
        let isSaving = false;

        // DOM elements
        const tbody = document.getElementById('tableBody');
        const filterDari = document.getElementById('filterDari');
        const filterSampai = document.getElementById('filterSampai');

        // Helper format rupiah
        function formatRupiah(angka) {
            if (!angka && angka !== 0) return '';
            let str = Math.floor(angka).toString();
            let result = '';
            for (let i = str.length - 1, j = 0; i >= 0; i--, j++) {
                if (j > 0 && j % 3 === 0) result = '.' + result;
                result = str[i] + result;
            }
            return result;
        }
        function parseRupiah(str) {
            if (!str) return 0;
            let cleaned = str.replace(/\./g, '').replace(/[^0-9]/g, '');
            return parseInt(cleaned) || 0;
        }

        // Mendapatkan hari ini dalam format YYYY-MM-DD
        function getTodayDate() { return new Date().toISOString().slice(0,10); }

        // Load data santri dan iuran dari Firebase
        async function loadMasterData() {
            try {
                const santriSnap = await db.collection('santri').get();
                santriList = [];
                santriSnap.forEach(doc => {
                    const d = doc.data();
                    santriList.push({ id: doc.id, nis: d.nis || '', nama: d.nama || '' });
                });
                // Load iuran konsumsi
                const konsumsiSnap = await db.collection('iuran_konsumsi').get();
                iuranKonsumsiMap.clear();
                konsumsiSnap.forEach(doc => {
                    const d = doc.data();
                    if (d.santriId) {
                        const arr = new Array(72).fill(0);
                        for (let i=0;i<72;i++) if (d[`bulan_${i}`]) arr[i] = d[`bulan_${i}`];
                        iuranKonsumsiMap.set(d.santriId, arr);
                    }
                });
                // Load iuran pondok
                const pondokSnap = await db.collection('iuran_pondok').get();
                iuranPondokMap.clear();
                pondokSnap.forEach(doc => {
                    const d = doc.data();
                    if (d.santriId) {
                        const arr = new Array(72).fill(0);
                        for (let i=0;i<72;i++) if (d[`bulan_${i}`]) arr[i] = d[`bulan_${i}`];
                        iuranPondokMap.set(d.santriId, arr);
                    }
                });
            } catch(err) { console.error(err); showToast('Gagal memuat data santri', true); }
        }

        // Load catatan pemasukan dari Firebase
        async function loadCatatan() {
            try {
                const snap = await db.collection('catatan_pemasukan').orderBy('tanggal', 'asc').get();
                const rows = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    rows.push({
                        id: doc.id,
                        tanggal: data.tanggal || getTodayDate(),
                        uraian: data.uraian || '',
                        konsumsi: data.konsumsi || 0,
                        bulanKonsumsi: data.bulanKonsumsi || '',
                        pondok: data.pondok || 0,
                        bulanPondok: data.bulanPondok || '',
                        jumlah: data.jumlah || 0,
                        exported: data.exported || false,
                        transaksiIds: data.transaksiIds || []
                    });
                });
                catatanList = rows;
                applyFilter();
            } catch(err) { showToast('Gagal memuat data', true); }
        }

        // Simpan otomatis (debounce)
        function triggerAutoSave() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => autoSaveAll(), 1000);
        }

        async function autoSaveAll() {
            if (isSaving) return;
            isSaving = true;
            try {
                const batch = db.batch();
                for (const row of catatanList) {
                    const docRef = row.id ? db.collection('catatan_pemasukan').doc(row.id) : db.collection('catatan_pemasukan').doc();
                    if (!row.id) row.id = docRef.id;
                    const data = {
                        tanggal: row.tanggal,
                        uraian: row.uraian,
                        konsumsi: row.konsumsi,
                        bulanKonsumsi: row.bulanKonsumsi,
                        pondok: row.pondok,
                        bulanPondok: row.bulanPondok,
                        jumlah: row.jumlah,
                        exported: row.exported || false,
                        transaksiIds: row.transaksiIds || [],
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    batch.set(docRef, data, { merge: true });
                }
                await batch.commit();
                showToast('Tersimpan otomatis');
            } catch(err) { showToast('Gagal simpan: '+err.message, true); }
            finally { isSaving = false; }
        }

        // Hitung nominal iuran berdasarkan bulan string (contoh "JUL (7), AGU (8)")
        function hitungNominalIuran(santriId, bulanStr, isKonsumsi) {
            if (!santriId || !bulanStr.trim()) return 0;
            const iuranMap = isKonsumsi ? iuranKonsumsiMap : iuranPondokMap;
            const iuranData = iuranMap.get(santriId);
            if (!iuranData) return 0;
            // Parse bulan string: "JUL (7), AGU (8), SEP (9)"
            const parts = bulanStr.split(',').map(p => p.trim());
            let total = 0;
            for (const part of parts) {
                const match = part.match(/^([A-Z]{3})\s*\((\d+)\)$/);
                if (match) {
                    const bulan = match[1];
                    const kelas = parseInt(match[2]);
                    const bulanMap = { JUL:0, AGU:1, SEP:2, OKT:3, NOV:4, DES:5, JAN:6, FEB:7, MAR:8, APR:9, MEI:10, JUN:11 };
                    const monthIdx = bulanMap[bulan];
                    if (monthIdx !== undefined && kelas >=7 && kelas <=12) {
                        const idx = (kelas-7)*12 + monthIdx;
                        total += iuranData[idx] || 0;
                    }
                }
            }
            return total;
        }

        // Cek apakah uraian mengandung format santri (NIS | NAMA)
        function extractSantriFromUraian(uraian) {
            const match = uraian.match(/(\d+)\s*\|\s*([^|]+)/);
            if (match) {
                const nis = match[1].trim();
                const nama = match[2].trim();
                const santri = santriList.find(s => s.nis === nis && s.nama === nama);
                if (santri) return santri;
            }
            return null;
        }

        // Render tabel dengan filter
        function applyFilter() {
            const dari = filterDari.value;
            const sampai = filterSampai.value;
            let filtered = [...catatanList];
            if (dari) filtered = filtered.filter(r => r.tanggal >= dari);
            if (sampai) filtered = filtered.filter(r => r.tanggal <= sampai);
            renderTable(filtered);
        }

        function renderTable(dataList) {
            if (!tbody) return;
            if (!dataList.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8">Belum ada catatan. Tambah baris baru.</td></tr>';
                return;
            }
            let html = '';
            dataList.forEach((row, idx) => {
                const rowClass = row.exported ? 'exported-row' : '';
                html += `<tr class="${rowClass}" data-id="${row.id}" data-index="${idx}">`;
                html += `<td><input type="date" class="field-tanggal" value="${row.tanggal}"><\/td>`;
                html += `<td class="relative"><input type="text" class="field-uraian" value="${escapeHtml(row.uraian)}" style="min-width:200px;"><div class="autocomplete-${idx} absolute left-0 top-full bg-white border hidden z-10"></div><\/td>`;
                html += `<td><input type="text" class="field-konsumsi rupiah-input" value="${formatRupiah(row.konsumsi)}"><\/td>`;
                html += `<td><input type="text" class="field-bulanKonsumsi" value="${row.bulanKonsumsi}" placeholder="JUL (7), AGU (8)"><\/td>`;
                html += `<td><input type="text" class="field-pondok rupiah-input" value="${formatRupiah(row.pondok)}"><\/td>`;
                html += `<td><input type="text" class="field-bulanPondok" value="${row.bulanPondok}" placeholder="JUL (7), AGU (8)"><\/td>`;
                html += `<td class="field-jumlah text-right font-medium">${formatRupiah(row.jumlah)}<\/td>`;
                html += `<td class="text-center"><button class="hapus-btn text-red-500 mr-2"><i class="fas fa-trash"></i></button><button class="export-btn ${row.exported ? 'bg-green-500' : 'bg-blue-500'} text-white px-2 py-1 rounded text-xs"><i class="fas fa-upload"></i> Export</button><\/td>`;
                html += `<\/tr>`;
            });
            tbody.innerHTML = html;

            // Attach event listeners
            document.querySelectorAll('.field-tanggal').forEach((input, i) => {
                input.removeEventListener('change', handleFieldChange);
                input.addEventListener('change', handleFieldChange);
            });
            document.querySelectorAll('.field-uraian').forEach((input, i) => {
                input.removeEventListener('input', handleUraianInput);
                input.addEventListener('input', handleUraianInput);
                // Buat autocomplete container
                const idx = input.closest('tr').dataset.index;
                const container = document.querySelector(`.autocomplete-${idx}`);
                if (container) input._autocompleteContainer = container;
            });
            document.querySelectorAll('.field-konsumsi, .field-pondok').forEach(input => {
                input.removeEventListener('input', formatRupiahEvent);
                input.addEventListener('input', formatRupiahEvent);
                input.removeEventListener('change', handleFieldChange);
                input.addEventListener('change', handleFieldChange);
            });
            document.querySelectorAll('.field-bulanKonsumsi, .field-bulanPondok').forEach(input => {
                input.removeEventListener('change', handleFieldChange);
                input.addEventListener('change', handleFieldChange);
            });
            document.querySelectorAll('.hapus-btn').forEach(btn => {
                btn.removeEventListener('click', handleHapus);
                btn.addEventListener('click', handleHapus);
            });
            document.querySelectorAll('.export-btn').forEach(btn => {
                btn.removeEventListener('click', handleExport);
                btn.addEventListener('click', handleExport);
            });
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
        function formatRupiahEvent(e) { let raw = e.target.value.replace(/\./g, ''); let num = parseInt(raw) || 0; e.target.value = formatRupiah(num); }

        async function handleFieldChange(e) {
            const input = e.target;
            const row = input.closest('tr');
            const rowId = row.dataset.id;
            const fieldClass = input.classList[0];
            let newValue = input.value;
            if (fieldClass === 'field-konsumsi' || fieldClass === 'field-pondok') {
                newValue = parseRupiah(newValue);
            }
            const rowIndex = catatanList.findIndex(r => r.id === rowId);
            if (rowIndex === -1) return;
            if (fieldClass === 'field-tanggal') catatanList[rowIndex].tanggal = newValue;
            if (fieldClass === 'field-uraian') catatanList[rowIndex].uraian = newValue;
            if (fieldClass === 'field-konsumsi') catatanList[rowIndex].konsumsi = newValue;
            if (fieldClass === 'field-bulanKonsumsi') catatanList[rowIndex].bulanKonsumsi = newValue;
            if (fieldClass === 'field-pondok') catatanList[rowIndex].pondok = newValue;
            if (fieldClass === 'field-bulanPondok') catatanList[rowIndex].bulanPondok = newValue;

            // Rekalkulasi otomatis jika ada perubahan pada bulan konsumsi atau pondok
            const uraian = catatanList[rowIndex].uraian;
            const santri = extractSantriFromUraian(uraian);
            if (santri) {
                if (fieldClass === 'field-bulanKonsumsi' || fieldClass === 'field-uraian') {
                    const nominal = hitungNominalIuran(santri.id, catatanList[rowIndex].bulanKonsumsi, true);
                    catatanList[rowIndex].konsumsi = nominal;
                }
                if (fieldClass === 'field-bulanPondok' || fieldClass === 'field-uraian') {
                    const nominal = hitungNominalIuran(santri.id, catatanList[rowIndex].bulanPondok, false);
                    catatanList[rowIndex].pondok = nominal;
                }
            }
            // Update jumlah
            catatanList[rowIndex].jumlah = (catatanList[rowIndex].konsumsi || 0) + (catatanList[rowIndex].pondok || 0);
            // Refresh baris
            applyFilter();
            triggerAutoSave();
        }

        async function handleUraianInput(e) {
            const input = e.target;
            const row = input.closest('tr');
            const rowId = row.dataset.id;
            const value = input.value;
            const rowIndex = catatanList.findIndex(r => r.id === rowId);
            if (rowIndex === -1) return;
            // Update uraian di data
            catatanList[rowIndex].uraian = value;
            // Cek apakah mengandung format santri
            const santri = extractSantriFromUraian(value);
            if (santri) {
                // Otomatis hitung konsumsi dan pondok berdasarkan bulan yang sudah diisi
                const konsumsi = hitungNominalIuran(santri.id, catatanList[rowIndex].bulanKonsumsi, true);
                const pondok = hitungNominalIuran(santri.id, catatanList[rowIndex].bulanPondok, false);
                catatanList[rowIndex].konsumsi = konsumsi;
                catatanList[rowIndex].pondok = pondok;
                catatanList[rowIndex].jumlah = konsumsi + pondok;
            } else {
                // Jika bukan santri, biarkan manual
            }
            applyFilter();
            triggerAutoSave();
            // Tampilkan autocomplete jika mengetik
            const keyword = value;
            if (keyword.length > 1) {
                const filteredSantri = santriList.filter(s => s.nis.includes(keyword) || s.nama.toLowerCase().includes(keyword.toLowerCase())).slice(0,5);
                const container = input._autocompleteContainer;
                if (container && filteredSantri.length) {
                    container.innerHTML = '';
                    filteredSantri.forEach(s => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = `${s.nis} | ${s.nama}`;
                        div.onclick = () => {
                            input.value = `${s.nis} | ${s.nama}`;
                            container.innerHTML = '';
                            container.classList.add('hidden');
                            // Trigger change
                            const changeEvent = new Event('change', { bubbles: true });
                            input.dispatchEvent(changeEvent);
                        };
                        container.appendChild(div);
                    });
                    container.classList.remove('hidden');
                } else if (container) container.classList.add('hidden');
            } else {
                if (input._autocompleteContainer) input._autocompleteContainer.classList.add('hidden');
            }
        }

        async function handleHapus(e) {
            const row = e.target.closest('tr');
            const rowId = row.dataset.id;
            if (!confirm('Hapus catatan ini?')) return;
            // Hapus dari Firestore
            await db.collection('catatan_pemasukan').doc(rowId).delete();
            // Hapus dari array lokal
            catatanList = catatanList.filter(r => r.id !== rowId);
            applyFilter();
            showToast('Catatan dihapus');
        }

        async function handleExport(e) {
            const btn = e.target.closest('.export-btn');
            const row = btn.closest('tr');
            const rowId = row.dataset.id;
            const rowData = catatanList.find(r => r.id === rowId);
            if (!rowData) return;
            if (rowData.exported) {
                showToast('Sudah pernah diexport', true);
                return;
            }
            // Cek apakah uraian mengandung santri atau umum
            const santri = extractSantriFromUraian(rowData.uraian);
            const transaksiIds = [];
            try {
                const batch = db.batch();
                if (santri) {
                    // Pembayaran santri: pecah per bulan
                    const bulanList = [];
                    if (rowData.bulanKonsumsi) {
                        const parts = rowData.bulanKonsumsi.split(',').map(p => p.trim());
                        for (const part of parts) {
                            const match = part.match(/^([A-Z]{3})\s*\((\d+)\)$/);
                            if (match) {
                                const bulanSingkat = match[1];
                                const kelas = parseInt(match[2]);
                                const bulanMap = { JUL:0, AGU:1, SEP:2, OKT:3, NOV:4, DES:5, JAN:6, FEB:7, MAR:8, APR:9, MEI:10, JUN:11 };
                                const monthIdx = bulanMap[bulanSingkat];
                                if (monthIdx !== undefined && kelas>=7 && kelas<=12) {
                                    const bulanIdx = (kelas-7)*12 + monthIdx;
                                    const nominal = hitungNominalIuran(santri.id, part, true);
                                    if (nominal > 0) {
                                        const docRef = db.collection('transaksi').doc();
                                        const data = {
                                            tanggal: rowData.tanggal,
                                            uraian: `Pembayaran Santri: ${santri.nis} | ${santri.nama} - ${bulanSingkat} (${kelas})`,
                                            pemasukan: nominal,
                                            pengeluaran: 0,
                                            tipe: 'pemasukan',
                                            jenis_iuran: 'konsumsi',
                                            santriId: santri.id,
                                            bulanIdx: bulanIdx,
                                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                        };
                                        batch.set(docRef, data);
                                        transaksiIds.push(docRef.id);
                                    }
                                }
                            }
                        }
                    }
                    if (rowData.bulanPondok) {
                        const parts = rowData.bulanPondok.split(',').map(p => p.trim());
                        for (const part of parts) {
                            const match = part.match(/^([A-Z]{3})\s*\((\d+)\)$/);
                            if (match) {
                                const bulanSingkat = match[1];
                                const kelas = parseInt(match[2]);
                                const bulanMap = { JUL:0, AGU:1, SEP:2, OKT:3, NOV:4, DES:5, JAN:6, FEB:7, MAR:8, APR:9, MEI:10, JUN:11 };
                                const monthIdx = bulanMap[bulanSingkat];
                                if (monthIdx !== undefined && kelas>=7 && kelas<=12) {
                                    const bulanIdx = (kelas-7)*12 + monthIdx;
                                    const nominal = hitungNominalIuran(santri.id, part, false);
                                    if (nominal > 0) {
                                        const docRef = db.collection('transaksi').doc();
                                        const data = {
                                            tanggal: rowData.tanggal,
                                            uraian: `Pembayaran Santri: ${santri.nis} | ${santri.nama} - ${bulanSingkat} (${kelas})`,
                                            pemasukan: nominal,
                                            pengeluaran: 0,
                                            tipe: 'pemasukan',
                                            jenis_iuran: 'pondok',
                                            santriId: santri.id,
                                            bulanIdx: bulanIdx,
                                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                        };
                                        batch.set(docRef, data);
                                        transaksiIds.push(docRef.id);
                                    }
                                }
                            }
                        }
                    }
                } else {
                    // Pemasukan umum
                    if (rowData.konsumsi > 0) {
                        const docRef = db.collection('transaksi').doc();
                        const data = {
                            tanggal: rowData.tanggal,
                            uraian: rowData.uraian || 'Pemasukan umum',
                            pemasukan: rowData.konsumsi,
                            pengeluaran: 0,
                            tipe: 'pemasukan',
                            jenis_iuran: 'konsumsi',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        batch.set(docRef, data);
                        transaksiIds.push(docRef.id);
                    }
                    if (rowData.pondok > 0) {
                        const docRef = db.collection('transaksi').doc();
                        const data = {
                            tanggal: rowData.tanggal,
                            uraian: rowData.uraian || 'Pemasukan umum',
                            pemasukan: rowData.pondok,
                            pengeluaran: 0,
                            tipe: 'pemasukan',
                            jenis_iuran: 'pondok',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        batch.set(docRef, data);
                        transaksiIds.push(docRef.id);
                    }
                }
                // Update catatan: set exported=true dan simpan transaksiIds
                const catatanRef = db.collection('catatan_pemasukan').doc(rowId);
                batch.update(catatanRef, { exported: true, transaksiIds: transaksiIds });
                await batch.commit();
                // Update local
                rowData.exported = true;
                rowData.transaksiIds = transaksiIds;
                applyFilter();
                showToast(`${transaksiIds.length} transaksi berhasil diexport`);
            } catch(err) { showToast('Gagal export: '+err.message, true); }
        }

        function showToast(msg, isError=false) {
            const toast = document.getElementById('toast');
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-emerald-400';
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Tambah baris baru
        function tambahBaris() {
            const newRow = {
                id: null,
                tanggal: getTodayDate(),
                uraian: '',
                konsumsi: 0,
                bulanKonsumsi: '',
                pondok: 0,
                bulanPondok: '',
                jumlah: 0,
                exported: false,
                transaksiIds: []
            };
            catatanList.push(newRow);
            applyFilter();
            triggerAutoSave();
        }

        // Filter event
        document.getElementById('filterBtn').addEventListener('click', applyFilter);
        document.getElementById('resetFilterBtn').addEventListener('click', () => { filterDari.value = ''; filterSampai.value = ''; applyFilter(); });
        document.getElementById('tambahBarisBtn').addEventListener('click', tambahBaris);

        // Inisialisasi
        window.addEventListener('DOMContentLoaded', async () => {
            await loadMasterData();
            await loadCatatan();
        });
    </script>
</body>
</html>
