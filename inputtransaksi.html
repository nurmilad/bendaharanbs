<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Input Transaksi - Pondok Pesantren Nurmilad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .rupiah-input { text-align: right; }
        .transaksi-list { max-height: 300px; overflow-y: auto; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: white; padding: 8px 14px; border-radius: 8px; z-index: 1000; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b">
        <div class="px-4 md:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="submenu.html" class="text-emerald-600 hover:text-emerald-700"><i class="fas fa-arrow-left text-lg"></i></a>
                <h1 class="font-bold text-gray-800 text-lg">Input Transaksi</h1>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-5xl mx-auto">
        <!-- Parameter jenis iuran dari URL -->
        <div id="jenisInfo" class="bg-emerald-50 p-2 rounded text-sm mb-4 text-center">Memproses...</div>

        <!-- Pilih Tipe Transaksi -->
        <div class="bg-white rounded-xl shadow p-4 mb-6">
            <label class="block font-semibold mb-2">Tipe Transaksi</label>
            <div class="flex gap-4">
                <label class="inline-flex items-center"><input type="radio" name="tipeTransaksi" value="pemasukan" checked class="mr-1"> Pemasukan</label>
                <label class="inline-flex items-center"><input type="radio" name="tipeTransaksi" value="pengeluaran" class="mr-1"> Pengeluaran</label>
            </div>
        </div>

        <!-- Panel Pemasukan (dinamis) -->
        <div id="panelPemasukan" class="bg-white rounded-xl shadow p-4 mb-6">
            <div class="flex items-center gap-3 mb-4">
                <input type="checkbox" id="pembayaranSantriCheckbox" class="w-4 h-4">
                <label for="pembayaranSantriCheckbox" class="font-semibold">Pembayaran Santri (khusus)</label>
            </div>

            <!-- Form Umum (bukan pembayaran santri) -->
            <div id="formUmum" class="space-y-3">
                <div><label class="block text-sm font-medium">Tanggal Transaksi</label><input type="date" id="tglUmum" class="w-full border rounded-lg p-2"></div>
                <div><label class="block text-sm font-medium">Uraian</label><input type="text" id="uraianUmum" class="w-full border rounded-lg p-2" placeholder="Contoh: Sumbangan masyarakat"></div>
                <div><label class="block text-sm font-medium">Jumlah (Rp)</label><input type="text" id="jumlahUmum" class="w-full border rounded-lg p-2 rupiah-input" placeholder="0"></div>
            </div>

            <!-- Form Khusus Santri (awal hidden) -->
            <div id="formSantri" class="hidden space-y-3">
                <div><label class="block text-sm font-medium">Tanggal Transaksi</label><input type="date" id="tglSantri" class="w-full border rounded-lg p-2"></div>
                <div><label class="block text-sm font-medium">Pilih Santri</label><select id="santriSelect" class="w-full border rounded-lg p-2"><option value="">-- Pilih Santri --</option></select></div>
                <div><label class="block text-sm font-medium">Kelas</label><select id="kelasSelect" class="w-full border rounded-lg p-2"><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div>
                <div><label class="block text-sm font-medium">Bulan Iuran (ceklis)</label>
                    <div class="grid grid-cols-3 md:grid-cols-6 gap-2" id="bulanChecklist"></div>
                </div>
                <div><label class="block text-sm font-medium">Total Jumlah (Rp)</label><input type="text" id="totalSantri" class="w-full border rounded-lg p-2 rupiah-input bg-gray-100" readonly></div>
            </div>

            <button id="tambahTransaksiBtn" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg w-full md:w-auto">+ Tambah ke Daftar</button>
        </div>

        <!-- Panel Pengeluaran (awal hidden) -->
        <div id="panelPengeluaran" class="hidden bg-white rounded-xl shadow p-4 mb-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-semibold">Daftar Pengeluaran</h3>
                <button id="tambahBarisPengeluaran" class="bg-blue-500 text-white px-3 py-1 rounded text-sm"><i class="fas fa-plus"></i> Baris</button>
            </div>
            <div id="pengeluaranTable" class="space-y-2">
                <!-- baris akan ditambah via JS -->
            </div>
            <button id="tambahPengeluaranBtn" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg w-full md:w-auto">+ Tambah ke Daftar</button>
        </div>

        <!-- Daftar Transaksi yang akan disimpan -->
        <div class="bg-white rounded-xl shadow p-4">
            <h3 class="font-semibold mb-2">Daftar Transaksi (Belum Tersimpan)</h3>
            <div id="daftarTransaksi" class="transaksi-list border rounded p-2 text-sm">
                <div class="text-gray-400 text-center py-4">Belum ada transaksi</div>
            </div>
            <div class="flex gap-3 mt-4">
                <button id="simpanSemuaBtn" class="bg-emerald-700 text-white px-5 py-2 rounded-lg">Simpan Semua</button>
                <button id="batalBtn" class="bg-gray-300 px-5 py-2 rounded-lg">Batal</button>
            </div>
        </div>
    </main>

    <div id="toast" class="toast hidden"><i class="fas fa-check-circle text-emerald-400"></i> <span id="toastMsg"></span></div>

    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD-8JKpTqvufYw5b1JHEbOPRiIrAfX4z9w",
            authDomain: "bendaharanbs.firebaseapp.com",
            projectId: "bendaharanbs",
            storageBucket: "bendaharanbs.firebasestorage.app",
            messagingSenderId: "853301471376",
            appId: "1:853301471376:web:7ac52bdf8ea65bfc169015"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Ambil jenis iuran dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const jenis = urlParams.get('jenis') === 'pondok' ? 'pondok' : 'konsumsi';
        const collectionIuran = jenis === 'konsumsi' ? 'iuran_konsumsi' : 'iuran_pondok';
        document.getElementById('jenisInfo').innerHTML = `📌 Mengelola transaksi untuk <strong>Iuran ${jenis === 'konsumsi' ? 'Konsumsi' : 'Pondok'}</strong>`;

        // Data global
        let santriList = [];            // { id, nis, nama, angkatan }
        let iuranDataMap = new Map();    // key santriId, value array iuran 72 bulan
        let daftarTransaksi = [];        // array objek transaksi yang akan disimpan

        // DOM elements
        const radioPemasukan = document.querySelector('input[value="pemasukan"]');
        const radioPengeluaran = document.querySelector('input[value="pengeluaran"]');
        const panelPemasukan = document.getElementById('panelPemasukan');
        const panelPengeluaran = document.getElementById('panelPengeluaran');
        const pembayaranSantriCheck = document.getElementById('pembayaranSantriCheckbox');
        const formUmum = document.getElementById('formUmum');
        const formSantri = document.getElementById('formSantri');
        const tambahTransaksiBtn = document.getElementById('tambahTransaksiBtn');
        const tambahPengeluaranBtn = document.getElementById('tambahPengeluaranBtn');
        const simpanSemuaBtn = document.getElementById('simpanSemuaBtn');
        const batalBtn = document.getElementById('batalBtn');
        const daftarDiv = document.getElementById('daftarTransaksi');
        const pengeluaranTable = document.getElementById('pengeluaranTable');
        const tambahBarisPengeluaran = document.getElementById('tambahBarisPengeluaran');

        // Helper: format rupiah
        function formatRupiah(angka) {
            if (!angka && angka !== 0) return '';
            let str = Math.floor(angka).toString();
            let result = '';
            for (let i = str.length - 1, j = 0; i >= 0; i--, j++) {
                if (j > 0 && j % 3 === 0) result = '.' + result;
                result = str[i] + result;
            }
            return result;
        }
        function parseRupiah(str) {
            if (!str) return 0;
            let cleaned = str.replace(/\./g, '').replace(/[^0-9]/g, '');
            return parseInt(cleaned) || 0;
        }
        // Pasang event auto-format pada input jumlah
        function attachRupiahFormat(inputElement) {
            if (!inputElement) return;
            inputElement.addEventListener('input', function(e) {
                let raw = e.target.value.replace(/\./g, '');
                let num = parseInt(raw) || 0;
                e.target.value = formatRupiah(num);
            });
        }

        // Datepicker default: hari ini, format tampilan dd/mm/yyyy (tapi input date tetap YYYY-MM-DD)
        function getTodayDate() { return new Date().toISOString().slice(0,10); }
        function setDefaultDate(inputId) { document.getElementById(inputId).value = getTodayDate(); }

        // Load data santri dan iuran
        async function loadData() {
            try {
                // Ambil santri
                const santriSnap = await db.collection('santri').get();
                santriList = [];
                santriSnap.forEach(doc => {
                    const d = doc.data();
                    santriList.push({
                        id: doc.id,
                        nis: d.nis || '',
                        nama: d.nama || '',
                        angkatan: d.angkatan || ''
                    });
                });
                santriList.sort((a,b) => (parseInt(a.nis)||0) - (parseInt(b.nis)||0));
                // Populate dropdown santri
                const santriSelect = document.getElementById('santriSelect');
                santriSelect.innerHTML = '<option value="">-- Pilih Santri --</option>';
                santriList.forEach(s => {
                    santriSelect.innerHTML += `<option value="${s.id}" data-nis="${s.nis}" data-nama="${s.nama}">${s.nis} | ${s.nama}</option>`;
                });

                // Ambil data iuran
                const iuranSnap = await db.collection(collectionIuran).get();
                iuranDataMap.clear();
                iuranSnap.forEach(doc => {
                    const d = doc.data();
                    const sid = d.santriId;
                    if (sid) {
                        const arr = new Array(72).fill(0);
                        for (let i=0; i<72; i++) if (d[`bulan_${i}`]) arr[i] = d[`bulan_${i}`];
                        iuranDataMap.set(sid, arr);
                    }
                });
            } catch(err) { console.error(err); showToast('Gagal memuat data santri', true); }
        }

        // Generate bulan checklist (JUL(7) s.d JUN(12) - total 72 bulan, tapi kita hanya tampilkan 12 bulan sesuai kelas)
        // Karena bulan terkait dengan kelas: untuk kelas X, bulan yang tersedia adalah bulan dengan label (X) yaitu tahun kelas tersebut.
        // Contoh kelas 7: bulan dengan label (7): JUL(7), AGU(7) ... JUN(7) => index 0-11
        // kelas 8: index 12-23, dst. Maka kita buat fungsi getBulanIndicesByKelas(kelas)
        function getBulanIndicesByKelas(kelas) {
            const kelasNum = parseInt(kelas);
            if (kelasNum >=7 && kelasNum <=12) {
                const start = (kelasNum - 7) * 12;
                return { start, end: start+11 };
            }
            return { start:0, end:11 };
        }
        // Buat checklist bulan berdasarkan kelas yang dipilih
        function renderBulanChecklist() {
            const kelas = document.getElementById('kelasSelect').value;
            const { start, end } = getBulanIndicesByKelas(kelas);
            const bulanNames = ['JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES', 'JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN'];
            const container = document.getElementById('bulanChecklist');
            container.innerHTML = '';
            for (let i=0; i<12; i++) {
                const bln = bulanNames[i];
                const idx = start + i;
                const tahunLabel = kelas;
                const label = `${bln} (${tahunLabel})`;
                const div = document.createElement('div');
                div.className = 'flex items-center gap-1';
                div.innerHTML = `<input type="checkbox" class="bulanCb" data-bulan-idx="${idx}" value="${idx}"> <span class="text-xs">${label}</span>`;
                container.appendChild(div);
            }
            // attach event untuk hitung total
            document.querySelectorAll('.bulanCb').forEach(cb => cb.addEventListener('change', hitungTotalSantri));
        }

        // Hitung total dari checkbox yang dipilih berdasarkan santri yang dipilih dan kelas
        async function hitungTotalSantri() {
            const santriId = document.getElementById('santriSelect').value;
            if (!santriId) { document.getElementById('totalSantri').value = ''; return; }
            const kelas = document.getElementById('kelasSelect').value;
            const { start } = getBulanIndicesByKelas(kelas);
            let total = 0;
            const checkboxes = document.querySelectorAll('.bulanCb:checked');
            const iuranData = iuranDataMap.get(santriId) || new Array(72).fill(0);
            for (let cb of checkboxes) {
                const idx = parseInt(cb.dataset.bulanIdx);
                total += iuranData[idx] || 0;
            }
            document.getElementById('totalSantri').value = formatRupiah(total);
        }

        // Event ketika santri berubah, reset checklist dan hitung ulang
        function onSantriChange() { renderBulanChecklist(); hitungTotalSantri(); }
        function onKelasChange() { renderBulanChecklist(); hitungTotalSantri(); }

        // Tambah transaksi dari panel pemasukan (umum atau santri)
        function tambahTransaksiPemasukan() {
            const isSantri = pembayaranSantriCheck.checked;
            const tgl = isSantri ? document.getElementById('tglSantri').value : document.getElementById('tglUmum').value;
            if (!tgl) { showToast('Tanggal harus diisi', true); return; }

            if (!isSantri) {
                const uraian = document.getElementById('uraianUmum').value.trim();
                const jumlahRaw = document.getElementById('jumlahUmum').value;
                const jumlah = parseRupiah(jumlahRaw);
                if (!uraian) { showToast('Uraian harus diisi', true); return; }
                if (jumlah <= 0) { showToast('Jumlah harus lebih dari 0', true); return; }
                daftarTransaksi.push({
                    tipe: 'pemasukan',
                    tanggal: tgl,
                    uraian: uraian,
                    pemasukan: jumlah,
                    pengeluaran: 0,
                    jenis_iuran: jenis,
                    detail: { type: 'umum' }
                });
                showToast('Transaksi umum ditambahkan');
                // reset form umum
                document.getElementById('uraianUmum').value = '';
                document.getElementById('jumlahUmum').value = '';
                setDefaultDate('tglUmum');
            } else {
                // Pembayaran santri: bisa multiple bulan, masing-masing dicatat sebagai entri terpisah
                const santriId = document.getElementById('santriSelect').value;
                if (!santriId) { showToast('Pilih santri', true); return; }
                const santri = santriList.find(s => s.id === santriId);
                if (!santri) return;
                const kelas = document.getElementById('kelasSelect').value;
                const { start } = getBulanIndicesByKelas(kelas);
                const checkboxes = document.querySelectorAll('.bulanCb:checked');
                if (checkboxes.length === 0) { showToast('Pilih minimal satu bulan', true); return; }
                const iuranData = iuranDataMap.get(santriId) || new Array(72).fill(0);
                let addedCount = 0;
                for (let cb of checkboxes) {
                    const idx = parseInt(cb.dataset.bulanIdx);
                    const nominal = iuranData[idx] || 0;
                    if (nominal <= 0) continue;
                    // Dapatkan label bulan
                    const bulanNames = ['JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES', 'JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN'];
                    const monthIndex = idx % 12;
                    const tahun = Math.floor(idx / 12) + 7;
                    const labelBulan = `${bulanNames[monthIndex]} (${tahun})`;
                    const uraianDetail = `Pembayaran Santri: ${santri.nis} | ${santri.nama} - ${labelBulan}`;
                    daftarTransaksi.push({
                        tipe: 'pemasukan',
                        tanggal: tgl,
                        uraian: uraianDetail,
                        pemasukan: nominal,
                        pengeluaran: 0,
                        jenis_iuran: jenis,
                        detail: { type: 'santri', santriId, bulanIdx: idx }
                    });
                    addedCount++;
                }
                if (addedCount === 0) showToast('Tidak ada bulan dengan nominal iuran > 0', true);
                else showToast(`${addedCount} transaksi pembayaran santri ditambahkan`);
                // reset checklist dan pilihan
                document.getElementById('santriSelect').value = '';
                document.getElementById('kelasSelect').value = '7';
                renderBulanChecklist();
                document.getElementById('totalSantri').value = '';
                setDefaultDate('tglSantri');
            }
            renderDaftarTransaksi();
        }

        // Pengeluaran: tambah dari tabel dinamis
        function tambahPengeluaran() {
            const rows = document.querySelectorAll('.pengeluaran-row');
            if (rows.length === 0) { showToast('Tidak ada baris pengeluaran', true); return; }
            for (let row of rows) {
                const tgl = row.querySelector('.tgl-pengeluaran').value;
                const uraian = row.querySelector('.uraian-pengeluaran').value.trim();
                const jumlahRaw = row.querySelector('.jumlah-pengeluaran').value;
                const jumlah = parseRupiah(jumlahRaw);
                if (!tgl) { showToast('Tanggal harus diisi', true); return; }
                if (!uraian) { showToast('Uraian harus diisi', true); return; }
                if (jumlah <= 0) { showToast('Jumlah harus > 0', true); return; }
                daftarTransaksi.push({
                    tipe: 'pengeluaran',
                    tanggal: tgl,
                    uraian: uraian,
                    pemasukan: 0,
                    pengeluaran: jumlah,
                    jenis_iuran: jenis,
                    detail: {}
                });
            }
            showToast(`${rows.length} transaksi pengeluaran ditambahkan`);
            // reset tabel pengeluaran (kosongkan semua baris, tambah satu baris baru)
            document.getElementById('pengeluaranTable').innerHTML = '';
            tambahBarisPengeluaranHandler();
            renderDaftarTransaksi();
        }

        // Render daftar transaksi
        function renderDaftarTransaksi() {
            if (daftarTransaksi.length === 0) {
                daftarDiv.innerHTML = '<div class="text-gray-400 text-center py-4">Belum ada transaksi</div>';
                return;
            }
            let html = '<table class="w-full text-xs border-collapse"><thead><tr><th>Tanggal</th><th>Uraian</th><th>Pemasukan</th><th>Pengeluaran</th><th></th></tr></thead><tbody>';
            daftarTransaksi.forEach((tr, idx) => {
                html += `<tr>
                    <td class="border p-1">${tr.tanggal}</td>
                    <td class="border p-1">${tr.uraian.substring(0,50)}</td>
                    <td class="border p-1 text-right">${formatRupiah(tr.pemasukan)}</td>
                    <td class="border p-1 text-right">${formatRupiah(tr.pengeluaran)}</td>
                    <td class="border p-1 text-center"><button class="hapus-transaksi text-red-500" data-idx="${idx}"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            daftarDiv.innerHTML = html;
            document.querySelectorAll('.hapus-transaksi').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.idx);
                    daftarTransaksi.splice(idx, 1);
                    renderDaftarTransaksi();
                });
            });
        }

        // Simpan semua transaksi ke Firebase (collection 'transaksi')
        async function simpanSemua() {
            if (daftarTransaksi.length === 0) { showToast('Tidak ada transaksi untuk disimpan', true); return; }
            showToast('Menyimpan...');
            try {
                const batch = db.batch();
                for (const tr of daftarTransaksi) {
                    const docRef = db.collection('transaksi').doc();
                    const data = {
                        tanggal: tr.tanggal,
                        uraian: tr.uraian,
                        pemasukan: tr.pemasukan,
                        pengeluaran: tr.pengeluaran,
                        tipe: tr.tipe,
                        jenis_iuran: tr.jenis_iuran,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (tr.detail.type === 'santri') {
                        data.santriId = tr.detail.santriId;
                        data.bulanIdx = tr.detail.bulanIdx;
                    }
                    batch.set(docRef, data);
                }
                await batch.commit();
                showToast(`${daftarTransaksi.length} transaksi berhasil disimpan`);
                daftarTransaksi = [];
                renderDaftarTransaksi();
            } catch(err) { showToast('Gagal simpan: '+err.message, true); }
        }

        // Fungsi untuk tabel pengeluaran (tambah baris)
        function tambahBarisPengeluaranHandler() {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'pengeluaran-row grid grid-cols-1 md:grid-cols-4 gap-2 items-end border-b pb-2 mb-2';
            rowDiv.innerHTML = `
                <div><label class="text-xs">Tanggal</label><input type="date" class="tgl-pengeluaran w-full border rounded p-1 text-sm" value="${getTodayDate()}"></div>
                <div><label class="text-xs">Uraian</label><input type="text" class="uraian-pengeluaran w-full border rounded p-1 text-sm" placeholder="Belanja alat tulis"></div>
                <div><label class="text-xs">Jumlah (Rp)</label><input type="text" class="jumlah-pengeluaran w-full border rounded p-1 text-sm rupiah-input" placeholder="0"></div>
                <div><button class="hapusBarisPengeluaran text-red-500 text-sm"><i class="fas fa-trash"></i> Hapus</button></div>
            `;
            pengeluaranTable.appendChild(rowDiv);
            attachRupiahFormat(rowDiv.querySelector('.jumlah-pengeluaran'));
            rowDiv.querySelector('.hapusBarisPengeluaran').addEventListener('click', () => rowDiv.remove());
        }

        // UI toggle antara pemasukan/pengeluaran
        function togglePanel() {
            const isPemasukan = radioPemasukan.checked;
            panelPemasukan.classList.toggle('hidden', !isPemasukan);
            panelPengeluaran.classList.toggle('hidden', isPemasukan);
            if (!isPemasukan && pengeluaranTable.children.length === 0) tambahBarisPengeluaranHandler();
        }

        // Toggle form umum/santri
        function toggleFormSantri() {
            const isSantri = pembayaranSantriCheck.checked;
            formUmum.classList.toggle('hidden', isSantri);
            formSantri.classList.toggle('hidden', !isSantri);
            if (isSantri) {
                setDefaultDate('tglSantri');
                renderBulanChecklist();
            } else setDefaultDate('tglUmum');
        }

        function showToast(msg, isError=false) {
            const toast = document.getElementById('toast');
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-emerald-400';
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Event listeners
        radioPemasukan.addEventListener('change', togglePanel);
        radioPengeluaran.addEventListener('change', togglePanel);
        pembayaranSantriCheck.addEventListener('change', toggleFormSantri);
        tambahTransaksiBtn.addEventListener('click', tambahTransaksiPemasukan);
        tambahPengeluaranBtn.addEventListener('click', tambahPengeluaran);
        simpanSemuaBtn.addEventListener('click', simpanSemua);
        batalBtn.addEventListener('click', () => { if(confirm('Batalkan semua transaksi yang belum tersimpan?')) { daftarTransaksi = []; renderDaftarTransaksi(); } });
        tambahBarisPengeluaran.addEventListener('click', tambahBarisPengeluaranHandler);
        document.getElementById('santriSelect').addEventListener('change', onSantriChange);
        document.getElementById('kelasSelect').addEventListener('change', onKelasChange);
        attachRupiahFormat(document.getElementById('jumlahUmum'));
        attachRupiahFormat(document.getElementById('totalSantri'));

        // Inisialisasi
        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            setDefaultDate('tglUmum');
            setDefaultDate('tglSantri');
            togglePanel();
            toggleFormSantri();
        });
    </script>
</body>
</html>
