<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Iuran Bulanan Santri - Pondok Pesantren Nurmilad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #f3f4f6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        /* Container scroll horizontal */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 0;
        }
        /* Tabel gaya Excel, border solid, tanpa border-radius */
        .excel-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
            font-size: 0.7rem;
            line-height: 1.3;
        }
        .excel-table th, 
        .excel-table td {
            border: 1px solid #cbd5e1;
            padding: 6px 4px;
            white-space: nowrap;
            background-color: white;
            vertical-align: middle;
        }
        /* Header sticky */
        .excel-table thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9;
            z-index: 30;
            font-weight: 600;
            font-size: 0.7rem;
            text-align: center;
        }
        /* Sticky kolom NO */
        .excel-table th:first-child,
        .excel-table td:first-child {
            position: sticky;
            left: 0;
            background-color: white;
            z-index: 20;
            text-align: center;
            width: 45px;
        }
        /* Sticky kolom ANGK */
        .excel-table th:nth-child(2),
        .excel-table td:nth-child(2) {
            position: sticky;
            left: 45px;
            background-color: white;
            z-index: 20;
            text-align: center;
            width: 55px;
        }
        /* Sticky kolom NIS | NAMA */
        .excel-table th:nth-child(3),
        .excel-table td:nth-child(3) {
            position: sticky;
            left: 100px;
            background-color: white;
            z-index: 20;
            min-width: 140px;
        }
        /* Input dalam sel: kecil, rapi, tanpa border radius berlebihan */
        .excel-input {
            width: 65px;
            padding: 4px 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0px;
            text-align: right;
            font-size: 0.7rem;
            background: #fff;
            font-family: monospace;
        }
        .excel-input:focus {
            outline: none;
            border-color: #10b981;
            background-color: #fefce8;
        }
        /* Toast sederhana */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 8px 14px;
            font-size: 0.75rem;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .saving-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #10b981;
            color: white;
            padding: 4px 12px;
            font-size: 0.7rem;
            z-index: 999;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- Header dengan auto-save info -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b">
        <div class="px-4 md:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="submenu.html" class="text-emerald-600 hover:text-emerald-700">
                    <i class="fas fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="font-bold text-gray-800 text-base" id="pageTitle">Iuran Bulanan</h1>
                    <p class="text-xs text-gray-500" id="pageDesc"></p>
                </div>
            </div>
            <div>
                <button id="pasteExcelBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded text-sm flex items-center gap-2 border">
                    <i class="fas fa-paste"></i> Tempel Excel
                </button>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6">
        <div id="loadingIndicator" class="text-center py-10 text-gray-400 hidden">
            <i class="fas fa-spinner fa-pulse text-emerald-600"></i> Memuat data...
        </div>

        <div class="table-wrapper shadow-sm">
            <table class="excel-table" id="iuranTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <p class="text-xs text-gray-400 mt-3 text-center">
            <i class="fas fa-save"></i> Auto-save setiap perubahan | Nilai dalam ribuan (contoh: 450 = Rp 450.000)
        </p>
    </main>

    <!-- Modal Tempel Excel -->
    <div id="pasteModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg w-full max-w-2xl mx-4">
            <div class="flex justify-between items-center border-b p-3">
                <h3 class="font-bold text-sm"><i class="fas fa-table me-2 text-emerald-600"></i>Tempel dari Excel</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4">
                <p class="text-xs text-gray-600 mb-2">Salin blok angka dari Excel (72 kolom) sesuai urutan santri. Pisahkan TAB.</p>
                <textarea id="pasteData" rows="8" class="w-full border rounded p-2 font-mono text-xs" placeholder="Tempel 72 angka per baris..."></textarea>
                <div class="flex justify-end gap-2 mt-3">
                    <button id="cancelPasteBtn" class="px-3 py-1 border rounded text-sm">Batal</button>
                    <button id="processPasteBtn" class="px-3 py-1 bg-emerald-600 text-white rounded text-sm">Terapkan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast & saving -->
    <div id="toastMessage" class="toast hidden">
        <i class="fas fa-check-circle text-emerald-400"></i> <span id="toastText"></span>
    </div>
    <div id="savingIndicator" class="saving-indicator hidden">
        <i class="fas fa-spinner fa-pulse"></i> Menyimpan...
    </div>

    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD-8JKpTqvufYw5b1JHEbOPRiIrAfX4z9w",
            authDomain: "bendaharanbs.firebaseapp.com",
            projectId: "bendaharanbs",
            storageBucket: "bendaharanbs.firebasestorage.app",
            messagingSenderId: "853301471376",
            appId: "1:853301471376:web:7ac52bdf8ea65bfc169015"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const jenis = urlParams.get('jenis') === 'pondok' ? 'pondok' : 'konsumsi';
        const collectionName = jenis === 'konsumsi' ? 'iuran_konsumsi' : 'iuran_pondok';
        document.getElementById('pageTitle').innerHTML = `Iuran Bulanan - ${jenis === 'konsumsi' ? 'Konsumsi' : 'Pondok'}`;
        document.getElementById('pageDesc').innerText = `Kelola iuran ${jenis === 'konsumsi' ? 'makanan' : 'fasilitas'} (ribuan Rp) - Auto save`;

        // Generate 72 bulan: JUL(7) s.d JUN(12)
        const bulanLabels = [];
        for (let tahun = 7; tahun <= 12; tahun++) {
            const bln = ['JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES', 'JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN'];
            for (let i = 0; i < bln.length; i++) bulanLabels.push(`${bln[i]} (${tahun})`);
        }
        const totalBulan = 72;

        let santriList = [];
        let saveTimeout = null;
        let isSaving = false;

        const tbody = document.getElementById('tableBody');
        const thead = document.getElementById('tableHeader');
        const loadingDiv = document.getElementById('loadingIndicator');
        const savingDiv = document.getElementById('savingIndicator');
        const toastMsg = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');

        function showToast(msg, isError = false) {
            const icon = toastMsg.querySelector('i');
            icon.className = isError ? "fas fa-exclamation-circle text-red-400" : "fas fa-check-circle text-emerald-400";
            toastText.innerText = msg;
            toastMsg.classList.remove('hidden');
            setTimeout(() => toastMsg.classList.add('hidden'), 2000);
        }

        function showSaving(show) {
            if (show) savingDiv.classList.remove('hidden');
            else savingDiv.classList.add('hidden');
        }

        function toRibuan(nominal) {
            if (!nominal) return '';
            return Math.round(nominal / 1000).toString();
        }

        // Render header
        function renderHeader() {
            let html = '<tr>';
            html += '<th>NO</th><th>ANGK</th><th>NIS | NAMA</th>';
            for (let bln of bulanLabels) html += `<th class="text-center" style="min-width:55px">${bln}</th>`;
            html += '</tr>';
            thead.innerHTML = html;
        }

        // Render tabel
        function renderTable() {
            if (!santriList.length) {
                tbody.innerHTML = `<tr><td colspan="${3+totalBulan}" class="text-center py-8 text-gray-400">Belum ada data santri. Silakan tambah di Data Santri.</td></tr>`;
                return;
            }
            let html = '';
            santriList.forEach((santri, idx) => {
                html += `<tr data-id="${santri.id}">`;
                html += `<td class="text-center">${idx+1}</td>`;
                html += `<td class="text-center">${santri.angkatan || ''}</td>`;
                html += `<td class="whitespace-nowrap">${santri.nis} | ${santri.nama}</td>`;
                for (let b = 0; b < totalBulan; b++) {
                    let val = santri.iuranData?.[b] || 0;
                    let display = toRibuan(val);
                    html += `<td class="p-0 text-center"><input type="text" class="excel-input" data-row="${idx}" data-col="${b}" value="${display}" placeholder="0"></td>`;
                }
                html += `</tr>`;
            });
            tbody.innerHTML = html;

            // Attach event untuk auto-save
            document.querySelectorAll('.excel-input').forEach(inp => {
                inp.removeEventListener('change', handleChange);
                inp.addEventListener('change', handleChange);
            });
        }

        async function handleChange(e) {
            const inp = e.target;
            const row = parseInt(inp.dataset.row);
            const col = parseInt(inp.dataset.col);
            let raw = inp.value.trim();
            if (raw === '') raw = '0';
            let ribuan = parseInt(raw);
            if (isNaN(ribuan)) ribuan = 0;
            const nominal = ribuan * 1000;
            santriList[row].iuranData[col] = nominal;
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => autoSave(), 700);
        }

        async function autoSave() {
            if (isSaving) return;
            isSaving = true;
            showSaving(true);
            try {
                for (const santri of santriList) {
                    const docRef = db.collection(collectionName).doc(santri.id);
                    const data = { santriId: santri.id };
                    for (let i = 0; i < totalBulan; i++) {
                        data[`bulan_${i}`] = santri.iuranData[i] || 0;
                    }
                    data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
                    await docRef.set(data, { merge: true });
                }
                showToast('Tersimpan otomatis');
            } catch (err) {
                console.error(err);
                showToast('Gagal simpan: ' + err.message, true);
            } finally {
                isSaving = false;
                showSaving(false);
            }
        }

        // Load data dari Firebase
        async function loadAllData() {
            loadingDiv.classList.remove('hidden');
            try {
                const santriSnap = await db.collection('santri').get();
                const santriTemp = [];
                santriSnap.forEach(doc => {
                    const d = doc.data();
                    santriTemp.push({
                        id: doc.id,
                        angkatan: d.angkatan || '',
                        nis: d.nis || '',
                        nama: d.nama || '',
                        noUrut: d.noUrut || 0
                    });
                });
                santriTemp.sort((a,b) => a.noUrut - b.noUrut);

                const iuranSnap = await db.collection(collectionName).get();
                const iuranMap = new Map();
                iuranSnap.forEach(doc => {
                    const d = doc.data();
                    const sid = d.santriId;
                    if (sid) {
                        const arr = new Array(totalBulan).fill(0);
                        for (let i=0; i<totalBulan; i++) {
                            if (d[`bulan_${i}`] !== undefined) arr[i] = d[`bulan_${i}`];
                        }
                        iuranMap.set(sid, arr);
                    }
                });

                santriList = santriTemp.map(s => ({
                    ...s,
                    iuranData: iuranMap.get(s.id) || new Array(totalBulan).fill(0)
                }));
                renderHeader();
                renderTable();
                showToast(`${santriList.length} santri dimuat`);
            } catch (err) {
                console.error(err);
                showToast('Gagal memuat data', true);
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }

        // Paste Excel
        const pasteModal = document.getElementById('pasteModal');
        const pasteData = document.getElementById('pasteData');
        function openPaste() { pasteData.value = ''; pasteModal.classList.remove('hidden'); }
        function closePaste() { pasteModal.classList.add('hidden'); }
        function processPaste() {
            const raw = pasteData.value;
            if (!raw.trim()) { showToast('Tidak ada data', true); closePaste(); return; }
            const lines = raw.split(/\r?\n/);
            let rowIdx = 0;
            let success = 0;
            for (let line of lines) {
                line = line.trim();
                if (line === '') continue;
                const parts = line.split(/\s+/);
                if (parts.length >= totalBulan && rowIdx < santriList.length) {
                    for (let b=0; b<totalBulan; b++) {
                        let val = parseInt(parts[b]);
                        if (isNaN(val)) val = 0;
                        santriList[rowIdx].iuranData[b] = val * 1000;
                    }
                    rowIdx++;
                    success++;
                } else if (rowIdx >= santriList.length) {
                    showToast('Kelebihan baris data', true);
                    break;
                } else {
                    showToast(`Baris ${rowIdx+1} kurang dari ${totalBulan} angka`, true);
                }
            }
            if (success > 0) {
                renderTable();
                autoSave();
                showToast(`${success} baris ditempel, auto-save...`);
            }
            closePaste();
        }

        document.getElementById('pasteExcelBtn').addEventListener('click', openPaste);
        document.getElementById('closeModalBtn').addEventListener('click', closePaste);
        document.getElementById('cancelPasteBtn').addEventListener('click', closePaste);
        document.getElementById('processPasteBtn').addEventListener('click', processPaste);
        pasteModal.addEventListener('click', (e) => { if (e.target === pasteModal) closePaste(); });

        window.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>
