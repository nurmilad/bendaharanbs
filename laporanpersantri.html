<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Laporan per Santri - Pondok Pesantren Nurmilad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .laporan-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.7rem;
        }
        .laporan-table th, .laporan-table td {
            border: 1px solid #cbd5e1;
            padding: 6px 4px;
            text-align: center;
            vertical-align: middle;
        }
        .laporan-table th {
            background-color: #f1f5f9;
            font-weight: 600;
        }
        .total-row {
            background-color: #fefce8;
            font-weight: 600;
        }
        .print-header, .print-footer {
            display: none;
        }
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 20px; background: white; }
            .no-print { display: none; }
            .print-header, .print-footer { display: block; }
            .laporan-table { width: 100%; font-size: 10pt; page-break-inside: avoid; }
            .print-header { text-align: center; margin-bottom: 20px; }
            .print-header h2 { font-size: 1.3rem; font-weight: bold; margin: 0; }
            .print-header h3 { font-size: 1rem; font-weight: 600; margin: 5px 0; }
            .print-header p { font-size: 1rem; margin: 5px 0; }
            .print-footer { margin-top: 40px; display: flex; justify-content: flex-start; flex-direction: column; align-items: flex-end; }
            .ttd-line { border-top: 1px solid black; width: 200px; margin-top: 20px; }
            .print-footer p { margin: 5px 0; text-align: right; }
        }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: white; padding: 8px 14px; border-radius: 8px; z-index: 1000; display: flex; align-items: center; gap: 8px; }
        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: white; }
        .autocomplete-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #d4d4d4; }
        .autocomplete-item:hover { background-color: #e9e9e9; }
        .relative { position: relative; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b no-print">
        <div class="px-4 md:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="#" id="backLink" class="text-emerald-600 hover:text-emerald-700"><i class="fas fa-arrow-left text-lg"></i></a>
                <h1 class="font-bold text-gray-800 text-lg">Laporan per Santri</h1>
            </div>
            <div>
                <button id="refreshDataBtn" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded text-sm flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> Refresh Data
                </button>
                <button id="cetakBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm flex items-center gap-2 ml-2">
                    <i class="fas fa-print"></i> Cetak
                </button>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-7xl mx-auto">
        <div id="jenisInfo" class="bg-emerald-50 p-2 rounded text-sm mb-4 text-center no-print">Memproses...</div>

        <div class="bg-white rounded-xl shadow p-4 mb-4 no-print">
            <label class="block text-sm font-medium mb-1">Cari Santri (NIS | NAMA)</label>
            <div class="relative">
                <input type="text" id="searchSantri" class="w-full border rounded-lg p-2" placeholder="Ketik NIS atau Nama..." autocomplete="off">
                <div id="autocompleteList" class="autocomplete-items hidden"></div>
            </div>
            <div class="mt-2 text-sm text-gray-500" id="selectedSantriInfo">Belum ada santri dipilih</div>
            <button id="tampilkanBtn" class="mt-3 bg-emerald-600 text-white px-4 py-2 rounded" disabled>Tampilkan Laporan</button>
        </div>

        <div class="print-area bg-white rounded-xl shadow overflow-hidden">
            <div class="print-header">
                <h2>LAPORAN PEMBAYARAN SANTRI</h2>
                <h3 id="printJenisIuran"></h3>
                <p id="printSantriIdentitas"></p>
            </div>
            <div class="overflow-x-auto">
                <table class="laporan-table" id="laporanTable">
                    <thead id="tableHeader"></thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" class="text-center py-10">Pilih santri terlebih dahulu</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="print-footer">
                <p>Lempong, <span id="printTanggalLaporan"></span></p>
                <p>Bendahara</p>
                <div class="ttd-line"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast hidden no-print"><i class="fas fa-check-circle text-emerald-400"></i> <span id="toastMsg"></span></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-8JKpTqvufYw5b1JHEbOPRiIrAfX4z9w",
            authDomain: "bendaharanbs.firebaseapp.com",
            projectId: "bendaharanbs",
            storageBucket: "bendaharanbs.firebasestorage.app",
            messagingSenderId: "853301471376",
            appId: "1:853301471376:web:7ac52bdf8ea65bfc169015"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const jenis = urlParams.get('jenis') === 'pondok' ? 'pondok' : 'konsumsi';
        const jenisIuranText = jenis === 'konsumsi' ? 'IURAN KONSUMSI' : 'IURAN PONDOK';
        document.getElementById('jenisInfo').innerHTML = `📌 Laporan per Santri - ${jenisIuranText}`;
        document.getElementById('backLink').href = `submenu.html?jenis=${jenis}`;
        document.getElementById('printJenisIuran').innerText = jenisIuranText;

        let santriList = [];
        let allTransactions = [];
        let selectedSantri = null;

        const searchInput = document.getElementById('searchSantri');
        const autocompleteList = document.getElementById('autocompleteList');
        const tampilkanBtn = document.getElementById('tampilkanBtn');
        const selectedSantriInfo = document.getElementById('selectedSantriInfo');

        function formatRupiah(angka) {
            if (!angka && angka !== 0) return '';
            let str = Math.floor(angka).toString();
            let result = '';
            for (let i = str.length - 1, j = 0; i >= 0; i--, j++) {
                if (j > 0 && j % 3 === 0) result = '.' + result;
                result = str[i] + result;
            }
            return result;
        }

        async function loadSantri() {
            try {
                const snap = await db.collection('santri').get();
                santriList = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    santriList.push({
                        id: doc.id,
                        nis: d.nis || '',
                        nama: d.nama || '',
                        angkatan: d.angkatan || ''
                    });
                });
                santriList.sort((a,b) => (parseInt(a.nis)||0) - (parseInt(b.nis)||0));
                console.log('Santri loaded:', santriList.length);
            } catch(err) { console.error(err); showToast('Gagal memuat data santri', true); }
        }

        async function loadTransactions() {
            try {
                let snap;
                try {
                    snap = await db.collection('transaksi')
                        .where('jenis_iuran', '==', jenis)
                        .get();
                } catch(e) {
                    console.warn('Query filtered gagal, ambil semua transaksi lalu filter manual');
                    snap = await db.collection('transaksi').get();
                }
                const trans = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    // Filter manual jika query tidak support
                    const dataJenis = data.jenis_iuran || jenis;
                    if (dataJenis !== jenis) return;
                    // Cek apakah ini pembayaran santri (ada santriId dan bulanIdx, dan pemasukan > 0)
                    if (data.santriId && data.bulanIdx !== undefined && (data.pemasukan > 0 || (data.tipe === 'pemasukan' && data.pemasukan > 0))) {
                        trans.push({
                            santriId: data.santriId,
                            bulanIdx: data.bulanIdx,
                            nominal: data.pemasukan
                        });
                    }
                });
                allTransactions = trans;
                console.log('Transaksi pembayaran santri loaded:', allTransactions.length);
            } catch(err) { console.error(err); showToast('Gagal memuat transaksi', true); }
        }

        // Fungsi refresh data: muat ulang santri dan transaksi
        async function refreshAllData() {
            showToast('Memuat ulang data...');
            await loadSantri();
            await loadTransactions();
            if (selectedSantri) {
                // Jika sudah ada santri terpilih, render ulang laporan
                renderLaporan();
            }
            showToast('Data berhasil dimuat ulang');
        }

        function filterSantri(keyword) {
            if (!keyword.trim()) return [];
            const lower = keyword.toLowerCase();
            return santriList.filter(s => 
                s.nis.toLowerCase().includes(lower) || 
                s.nama.toLowerCase().includes(lower)
            ).slice(0, 10);
        }

        function showAutocomplete(items) {
            if (items.length === 0) {
                autocompleteList.classList.add('hidden');
                return;
            }
            autocompleteList.innerHTML = '';
            items.forEach(s => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.textContent = `${s.nis} | ${s.nama}`;
                div.addEventListener('click', () => selectSantri(s));
                autocompleteList.appendChild(div);
            });
            autocompleteList.classList.remove('hidden');
        }

        function selectSantri(santri) {
            selectedSantri = santri;
            searchInput.value = `${santri.nis} | ${santri.nama}`;
            selectedSantriInfo.innerHTML = `<i class="fas fa-check-circle text-emerald-600"></i> Terpilih: ${santri.nis} | ${santri.nama} (Angkatan ${santri.angkatan || '-'})`;
            tampilkanBtn.disabled = false;
            autocompleteList.classList.add('hidden');
            // Langsung render laporan setelah pilih santri
            renderLaporan();
        }

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value;
            if (!keyword.trim()) {
                autocompleteList.classList.add('hidden');
                selectedSantri = null;
                selectedSantriInfo.innerHTML = 'Belum ada santri dipilih';
                tampilkanBtn.disabled = true;
                return;
            }
            const filtered = filterSantri(keyword);
            showAutocomplete(filtered);
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !autocompleteList.contains(e.target)) {
                autocompleteList.classList.add('hidden');
            }
        });

        function renderLaporan() {
            if (!selectedSantri) return;

            const matrix = Array(12).fill().map(() => Array(6).fill(0));
            const bulanNames = ['JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER', 'JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI'];
            
            const transaksiSantri = allTransactions.filter(t => t.santriId === selectedSantri.id);
            console.log(`Transaksi untuk santri ${selectedSantri.nis}:`, transaksiSantri.length);
            for (const tr of transaksiSantri) {
                const bulanIdx = tr.bulanIdx;
                if (bulanIdx === undefined || bulanIdx < 0 || bulanIdx >= 72) continue;
                const kelas = Math.floor(bulanIdx / 12) + 7;
                const monthIndex = bulanIdx % 12;
                if (kelas >= 7 && kelas <= 12) {
                    matrix[monthIndex][kelas - 7] = tr.nominal;
                }
            }

            let headerHtml = '<thead><tr><th>Bulan</th><th>Kelas 7</th><th>Kelas 8</th><th>Kelas 9</th><th>Kelas 10</th><th>Kelas 11</th><th>Kelas 12</th></tr></thead>';
            let bodyHtml = '<tbody>';
            let totalPerKelas = [0,0,0,0,0,0];
            for (let i = 0; i < 12; i++) {
                bodyHtml += '<tr>';
                bodyHtml += `<td class="font-medium">${bulanNames[i]}</td>`;
                for (let k = 0; k < 6; k++) {
                    const val = matrix[i][k];
                    totalPerKelas[k] += val;
                    bodyHtml += `<td class="text-right">${val ? formatRupiah(val) : ''}</td>`;
                }
                bodyHtml += '</tr>';
            }
            bodyHtml += '<tr class="total-row"><td class="font-bold">JUMLAH</td>';
            for (let k = 0; k < 6; k++) {
                bodyHtml += `<td class="text-right font-bold">${formatRupiah(totalPerKelas[k])}</td>`;
            }
            bodyHtml += '</tr></tbody>';
            
            const table = document.getElementById('laporanTable');
            table.innerHTML = headerHtml + bodyHtml;

            const now = new Date();
            const tglStr = `${now.getDate()} ${getNamaBulan(now.getMonth()+1)} ${now.getFullYear()}`;
            document.getElementById('printTanggalLaporan').innerText = tglStr;
            document.getElementById('printSantriIdentitas').innerHTML = `${selectedSantri.nis} | ${selectedSantri.nama}`;
        }

        function getNamaBulan(bln) {
            const nama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            return nama[bln-1];
        }

        async function tampilkanLaporan() {
            if (!selectedSantri) {
                showToast('Pilih santri terlebih dahulu', true);
                return;
            }
            // Pastikan transaksi sudah dimuat, jika belum muat ulang
            if (allTransactions.length === 0) await loadTransactions();
            renderLaporan();
        }

        function showToast(msg, isError=false) {
            const toast = document.getElementById('toast');
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-emerald-400';
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        document.getElementById('cetakBtn').addEventListener('click', () => window.print());
        document.getElementById('refreshDataBtn').addEventListener('click', refreshAllData);
        tampilkanBtn.addEventListener('click', tampilkanLaporan);

        window.addEventListener('DOMContentLoaded', async () => {
            await loadSantri();
            await loadTransactions(); // preload transaksi
        });
    </script>
</body>
</html>
